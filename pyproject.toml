[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ora-lint"
version="0.1.0"
description="High-signal Oracle SQL and PL/SQL static checks."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Raoul Munet"}]
dependencies=[]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
ora-lint="ora_lint.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
